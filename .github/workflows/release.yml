name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.1.0. Must already exist."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: macos-15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with the manifest produces installers whose in-app
      # version does not match the release they were downloaded from, and an
      # updater that never settles. Fail here instead.
      - name: Check the tag matches the manifests
        run: |
          EXPECTED="${{ steps.tag.outputs.version }}"
          for manifest in package.json apps/api/package.json apps/desktop/package.json apps/web/package.json packages/database/package.json packages/domain/package.json packages/practice/package.json packages/provider/package.json packages/training/package.json; do
            ACTUAL="$(node -p "require('./${manifest}').version")"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::${manifest} is at ${ACTUAL} but the tag says ${EXPECTED}"
              exit 1
            fi
          done

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @spar/desktop verify:build

  package:
    name: Package ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
            flag: "--mac"
          - platform: windows
            os: windows-2025
            flag: "--win"
          - platform: linux
            os: ubuntu-24.04
            flag: "--linux"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      # keytar links against libsecret, and the runner image ships neither the
      # headers nor a prebuild for this Electron ABI.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Both faults that shipped in 0.1.0 were invisible to typecheck, tests and
      # packaging, and both produced an app that opens and then cannot work. This
      # is the gate that would have caught either one.
      - name: Verify the built output can launch
        run: pnpm --filter @spar/desktop verify:build

      - name: Rebuild native modules for Electron
        run: pnpm --filter @spar/desktop rebuild:native

      # Signing is optional for this open distribution. When identities are
      # configured we use them; otherwise auto-discovery is disabled so an
      # unsigned build is intentional and repeatable rather than depending on
      # whatever happens to be in a runner keychain.
      - name: Package
        working-directory: apps/desktop
        shell: bash
        env:
          # Stamped into the build so a downloaded app knows where the hosted API
          # is. Without it a packaged build falls back to localhost, which nobody
          # who downloads Spar is running. Set as a repository variable.
          SPAR_HOSTED_API_ORIGIN: ${{ vars.SPAR_HOSTED_API_ORIGIN }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID_INPUT: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_INPUT: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_INPUT: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_ID_INPUT" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD_INPUT" ] && [ -n "$APPLE_TEAM_ID_INPUT" ]; then
              export CSC_LINK="$MACOS_CERTIFICATE_BASE64"
              export CSC_KEY_PASSWORD="$MACOS_CERTIFICATE_PASSWORD"
              export APPLE_ID="$APPLE_ID_INPUT"
              export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_INPUT"
              export APPLE_TEAM_ID="$APPLE_TEAM_ID_INPUT"
            else
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              echo "::warning title=Unsigned macOS build::No Developer ID identity is configured. Users may need to approve the downloaded app manually and automatic install can be unavailable."
            fi
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            if [ -n "$WINDOWS_CERTIFICATE_BASE64" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
              export CSC_LINK="$WINDOWS_CERTIFICATE_BASE64"
              export CSC_KEY_PASSWORD="$WINDOWS_CERTIFICATE_PASSWORD"
            else
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              echo "::warning title=Unsigned Windows build::No Authenticode identity is configured. SmartScreen can require manual approval and automatic install can be unavailable."
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # electron-builder is invoked directly rather than through a package
          # script: forwarding flags via `pnpm run x -- --publish never` did not
          # reach it, and electron-builder defaults to publishing on CI when a tag
          # is present, so the flag being dropped meant every job tried to publish
          # and failed on a token it was never given. Locally the same command
          # looked fine, because off CI the default is not to publish.
          #
          # extraMetadata writes the origin into the packaged package.json, which
          # is the only way a build-time value survives into a downloaded app.
          pnpm exec electron-builder ${{ matrix.flag }} --publish never \
            -c.releaseInfo.releaseNotesFile="../../.github/release-notes/${RELEASE_TAG}.md" \
            -c.extraMetadata.sparHostedApiOrigin="$SPAR_HOSTED_API_ORIGIN"

      # This YAML is the updater API. An installer can exist while the feed is
      # missing notes or the correct architecture, so validate the contract
      # before uploading anything a running app could discover.
      - name: Verify update feed
        working-directory: apps/desktop
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            macos) FEED=dist-release/latest-mac.yml ;;
            windows) FEED=dist-release/latest.yml ;;
            linux) FEED=dist-release/latest-linux.yml ;;
          esac
          test -s "$FEED"
          grep -q "^version: ${{ needs.verify.outputs.version }}$" "$FEED"
          grep -q "^releaseNotes:" "$FEED"
          if [ "${{ matrix.platform }}" = "macos" ]; then
            grep -q -- "-arm64-mac.zip" "$FEED"
            grep -q -- "-mac.zip" "$FEED"
          fi

      # latest*.yml is what electron-updater reads, so it is a release asset like
      # any installer, not a build leftover.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: spar-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            apps/desktop/dist-release/*.dmg
            apps/desktop/dist-release/*.zip
            apps/desktop/dist-release/*.exe
            apps/desktop/dist-release/*.AppImage
            apps/desktop/dist-release/*.deb
            apps/desktop/dist-release/latest*.yml
            apps/desktop/dist-release/*.blockmap

  publish:
    name: Publish release
    needs: [verify, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          ls -la release-assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Spar $TAG" \
              --notes-file .github/release-notes/"$TAG".md \
              --verify-tag
          fi
